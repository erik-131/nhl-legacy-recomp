# Shared ccache settings for all worktrees (build.sh exports CCACHE_CONFIGPATH=nhl-work/ccache.conf; copy this file there).
# base_dir + hash_dir=false: the same source compiled from another worktree or build dir is a cache HIT (measured).
base_dir = $HOME   # set to your home directory (ccache does not expand variables)
hash_dir = false
# the project uses clang PCH; without these ccache reports every PCH compile as "uncacheable: could not use precompiled header"
sloppiness = pch_defines,time_macros,include_file_mtime,include_file_ctime
max_size = 2.0G
compression = true
compression_level = 1
